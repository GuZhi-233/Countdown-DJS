name: 功能建议
description: 为主程序提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 请描述当前使用中不方便的地方
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的做法
      description: 描述你期待的功能或交互方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他实现方式或临时替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 倒计时与项目管理
        - 外观与布局编辑
        - 动态壁纸与全屏
        - 独立悬浮控件
        - 插件系统
        - 远程控制
        - 其他
    validations:
      required: true
